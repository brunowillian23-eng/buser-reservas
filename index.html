<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferramenta Interna — Buser</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
  :root {
    --pink: #AD1457;
    --pink-dark: #880E4F;
    --pink-light: #F8BBD9;
    --pink-bg: #FFF0F6;
    --gray-bg: #F7F7F8;
    --gray-border: #E5E5E5;
    --gray-text: #666;
    --dark: #1A1A2E;
    --white: #FFFFFF;
    --success: #1B7F3A;
    --danger: #C62828;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-bg); color: var(--dark); min-height: 100vh; }

  /* NAV */
  nav {
    background: var(--white);
    border-bottom: 1px solid var(--gray-border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    height: 60px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .nav-logo-mark {
    width: 36px;
    height: 36px;
    background: var(--pink);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-logo span {
    font-size: 18px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: -0.3px;
  }
  .nav-logo span em { color: var(--pink); font-style: normal; }
  .nav-divider { width: 1px; height: 24px; background: var(--gray-border); }
  .nav-subtitle { font-size: 13px; color: var(--gray-text); }
  .nav-badge {
    margin-left: auto;
    background: var(--pink-bg);
    color: var(--pink);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--pink-light);
    letter-spacing: 0.3px;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, var(--pink-dark) 0%, var(--pink) 60%, #D81B60 100%);
    padding: 40px 32px 36px;
    color: var(--white);
  }
  .hero-inner { max-width: 1100px; margin: 0 auto; }
  .hero h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
  .hero p { font-size: 15px; opacity: 0.85; }
  .hero-tabs {
    display: flex;
    gap: 8px;
    margin-top: 24px;
  }
  .hero-tab {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .hero-tab.active, .hero-tab:hover {
    background: rgba(255,255,255,0.28);
    border-color: rgba(255,255,255,0.5);
  }

  /* CONTAINER */
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 32px; }

  /* SECTIONS */
  .section { display: none; }
  .section.active { display: block; }

  /* CARDS */
  .card {
    background: var(--white);
    border-radius: 14px;
    border: 1px solid var(--gray-border);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .card-title .icon {
    width: 36px; height: 36px;
    background: var(--pink-bg);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
  }
  .card-title .icon svg { color: var(--pink); }
  .card-title h2 { font-size: 15px; font-weight: 600; }
  .card-title p { font-size: 12px; color: var(--gray-text); margin-top: 1px; }

  /* DROP ZONE */
  .drop-zone {
    border: 2px dashed var(--pink-light);
    border-radius: 10px;
    padding: 36px;
    text-align: center;
    cursor: pointer;
    background: var(--pink-bg);
    transition: all 0.2s;
  }
  .drop-zone:hover, .drop-zone.drag {
    border-color: var(--pink);
    background: #FCE4EC;
  }
  .drop-zone h3 { font-size: 14px; font-weight: 600; color: var(--dark); margin-bottom: 5px; }
  .drop-zone p { font-size: 12px; color: var(--gray-text); margin-bottom: 16px; }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 20px; border-radius: 9px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    border: none; transition: all 0.15s;
    text-decoration: none;
  }
  .btn-pink { background: var(--pink); color: #fff; }
  .btn-pink:hover { background: var(--pink-dark); }
  .btn-pink:disabled { background: var(--pink-light); color: #fff; cursor: not-allowed; }
  .btn-outline {
    background: var(--white); color: var(--dark);
    border: 1px solid var(--gray-border);
  }
  .btn-outline:hover { background: var(--gray-bg); border-color: #ccc; }

  /* SELECTS CONFIG */
  .config-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .config-grid label { font-size: 11px; font-weight: 600; color: var(--gray-text); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
  .config-grid select {
    width: 100%; padding: 8px 10px;
    border: 1px solid var(--gray-border); border-radius: 8px;
    font-size: 13px; background: var(--gray-bg);
    color: var(--dark);
  }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--white);
    border: 1px solid var(--gray-border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .stat-card .lbl { font-size: 11px; color: var(--gray-text); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
  .stat-card .val { font-size: 28px; font-weight: 700; color: var(--pink); margin-top: 2px; }

  /* ACTIONS BAR */
  .actions-bar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-bottom: 16px;
  }
  .actions-bar input[type="text"] {
    padding: 8px 12px; border: 1px solid var(--gray-border);
    border-radius: 9px; font-size: 13px; min-width: 200px;
    background: var(--white);
  }

  /* TABLE */
  #export-area {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--gray-border);
    background: var(--white);
  }
  .export-header {
    background: var(--pink);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .export-header .eh-icon {
    width: 34px; height: 34px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .export-header h2 { color: #fff; font-size: 14px; font-weight: 600; }
  .export-header p { color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 1px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { background: #FAFAFA; }
  thead th {
    padding: 10px 16px; text-align: left;
    font-weight: 600; font-size: 11px; color: var(--gray-text);
    border-bottom: 1px solid var(--gray-border);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  tbody td { padding: 9px 16px; border-bottom: 1px solid #F5F5F5; }

  /* LEGEND */
  .legend-box {
    background: var(--white); border-radius: 12px
